<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destination Details | Wanderlux</title>
  <meta name="description" content="Explore a tailored Wanderlux destination journey.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-sand-50 text-slate-800 antialiased">
  <header class="glass-nav sticky top-0 z-40"><div class="page-shell nav-shell"><a href="index.html" class="brand-lockup"><span class="brand-mark"><i class="fa-solid fa-paper-plane"></i></span><span><strong>Wander<span>lux</span></strong><small>Curated Journeys</small></span></a><nav class="page-nav"><a href="about.html">About</a><a href="destinations.html" class="is-current">Destinations</a><a href="index.html#styles">Experiences</a><a href="packages.html">Packages</a><a href="index.html#blog">Journal</a><a href="contact.html">Contact</a></nav><a href="book.html" class="page-cta">Plan my trip <i class="fa-solid fa-arrow-right"></i></a></div></header>
  <main id="destination-details">
    <div class="destination-detail-loading page-shell">Loading your destination...</div>
  </main>
  <footer class="page-footer"><div class="page-shell footer-line"><span>© 2026 Wanderlux Curated Journeys Ltd.</span><span><a href="destinations.html">All destinations</a><a href="contact.html">Contact</a></span></div></footer>
  <script src="js/data.js"></script>
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('id');
      var destination = travelData.destinations.find(function (item) { return item.id === id; });
      var root = document.getElementById('destination-details');
      if (!destination) {
        root.innerHTML = '<div class="page-shell destination-not-found"><span class="eyebrow">Destination not found</span><h1>Let’s find another beautiful place.</h1><a class="page-button" href="destinations.html">Browse destinations <i class="fa-solid fa-arrow-right"></i></a></div>';
        return;
      }
      document.title = destination.name + ' | Wanderlux';
      root.innerHTML =
        '<section class="destination-detail-hero"><img src="' + destination.image + '" alt="' + destination.name + '" loading="eager"><div class="destination-detail-shade"></div><div class="page-shell destination-detail-hero-content"><span class="eyebrow">' + destination.country + ' · ' + destination.region + '</span><h1>' + destination.name + '</h1><p>' + destination.description + '</p><div class="destination-detail-meta"><span><i class="fa-solid fa-clock"></i>' + destination.duration + '</span><span><i class="fa-solid fa-star"></i>' + destination.rating + ' (' + destination.reviewsCount + ' reviews)</span></div></div></section>' +
        '<section class="page-section destination-detail-body"><div class="page-shell destination-detail-grid"><div><span class="eyebrow">Your journey, considered</span><h2>Go beyond the postcard.</h2><p class="story-copy">A Wanderlux itinerary gives you the freedom to travel slowly, with thoughtful stays, local expertise and the flexibility to make the days your own.</p><div class="destination-highlight-list">' + destination.highlights.map(function (highlight) { return '<div><i class="fa-solid fa-check"></i><span>' + highlight + '</span></div>'; }).join('') + '</div></div><aside class="destination-detail-card"><span class="eyebrow">From</span><strong>$' + destination.priceUSD.toLocaleString() + '</strong><small>per person</small><div class="destination-detail-card-line"><span>Best season</span><b>' + destination.bestSeason + '</b></div><div class="destination-detail-card-line"><span>Weather</span><b>' + destination.weather + '</b></div><a href="book.html?journey=' + encodeURIComponent(destination.name) + '" class="page-button">Plan this journey <i class="fa-solid fa-arrow-right"></i></a></aside></div></section>' +
        '<section class="destination-detail-cta"><div class="page-shell"><span class="eyebrow">Not quite the one?</span><h2>Explore every possibility.</h2><a href="destinations.html" class="text-link">Back to destinations <i class="fa-solid fa-arrow-right"></i></a></div></section>';
    })();
  </script>
</body>
</html>
